name: Release on main

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump to apply when exact_version is empty"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      exact_version:
        description: "Optional exact version (X.Y.Z or vX.Y.Z); overrides bump"
        required: false
        type: string
      dry_run:
        description: "Preview without committing, tagging, or publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve dry-run mode
        id: dryrun
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          case "${DRY_RUN,,}" in
            1|true|yes|on) echo "enabled=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "enabled=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Determine last release tag
        id: last_tag
        run: |
          git fetch --tags --force
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v0.0.0"
          fi
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Gather merged PRs since last tag
        id: prs
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_TAG: ${{ steps.last_tag.outputs.last_tag }}
        run: |
          set -euo pipefail
          OWNER_REPO="${GITHUB_REPOSITORY}"
          OWNER="${OWNER_REPO%/*}"
          REPO="${OWNER_REPO#*/}"

          if [ "$LAST_TAG" = "v0.0.0" ]; then
            # No prior release — look back 30 days instead of all time.
            START_DATE=$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          else
            START_DATE=$(git log -1 --format=%cI "$LAST_TAG")
          fi

          gh api \
            --paginate \
            --slurp \
            "/repos/$OWNER/$REPO/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
            > /tmp/all_prs.json

          jq --arg start "$START_DATE" 'flatten | map(select(.merged_at != null and .merged_at > $start)) | sort_by(.merged_at)' /tmp/all_prs.json > /tmp/merged_prs.json

          COUNT=$(jq 'length' /tmp/merged_prs.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

          jq '[.[] | {number, title, body: (.body // "" | .[:200]), labels: [.labels[].name], user: .user.login, merged_at, html_url}]' /tmp/merged_prs.json > /tmp/pr_context.json

      - name: Determine target version
        id: version
        env:
          CURRENT: ${{ steps.last_tag.outputs.current_version }}
          BUMP: ${{ inputs.bump }}
          EXACT_VERSION: ${{ inputs.exact_version }}
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const current = process.env.CURRENT;
          const bump = process.env.BUMP;
          const exactInput = (process.env.EXACT_VERSION || "").trim();
          const semverPattern = /^\d+\.\d+\.\d+$/;

          function parseVersion(value, label) {
            const normalized = value.replace(/^v/, "");
            if (!semverPattern.test(normalized)) {
              throw new Error(`${label} must be a stable semver like 1.2.3 or v1.2.3`);
            }
            return normalized.split(".").map(Number);
          }

          function compareVersions(a, b) {
            for (let i = 0; i < 3; i += 1) {
              if (a[i] !== b[i]) return a[i] - b[i];
            }
            return 0;
          }

          const currentParts = parseVersion(current, "package.json version");
          let nextParts;
          let decision;
          let reason;

          if (exactInput) {
            nextParts = parseVersion(exactInput, "exact_version");
            if (compareVersions(nextParts, currentParts) < 0) {
              throw new Error(`exact_version ${nextParts.join(".")} is lower than current ${current}`);
            }
            decision = "exact";
            reason = `Manual release requested exact version v${nextParts.join(".")}.`;
          } else {
            nextParts = [...currentParts];
            if (bump === "major") {
              nextParts[0] += 1;
              nextParts[1] = 0;
              nextParts[2] = 0;
            } else if (bump === "minor") {
              nextParts[1] += 1;
              nextParts[2] = 0;
            } else if (bump === "patch") {
              nextParts[2] += 1;
            } else {
              throw new Error(`unsupported bump: ${bump}`);
            }
            decision = bump;
            reason = `Manual release requested ${bump} bump.`;
          }

          const next = nextParts.join(".");
          console.log(`current=${current}`);
          console.log(`next=${next}`);
          console.log(`tag=v${next}`);
          console.log(`decision=${decision}`);
          console.log(`reason=${reason}`);
          console.log(`changed=${next === current ? "false" : "true"}`);
          NODE

      - name: Update package version
        if: steps.version.outputs.changed == 'true'
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const p='package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.version=process.argv[1]; fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');" -- "$NEXT"
          if [ -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi

      - name: Check tag does not already exist
        id: tag_check
        if: steps.version.outputs.tag != '' && steps.dryrun.outputs.enabled != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG. Skipping tag creation to keep idempotent."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit package version
        if: steps.version.outputs.changed == 'true' && steps.dryrun.outputs.enabled != 'true' && steps.tag_check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json || true
          git commit -m "release: ${TAG} [skip release]"

      - name: Tag and push
        if: steps.version.outputs.tag != '' && steps.dryrun.outputs.enabled != 'true' && steps.tag_check.outputs.exists != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag "$TAG"
          git push --atomic origin main "$TAG"

      - name: Build changelog markdown
        id: changelog
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DECISION: ${{ steps.version.outputs.decision }}
          REASON: ${{ steps.version.outputs.reason }}
        run: |
          set -euo pipefail
          {
            echo "## ${TAG}"
            echo
            echo "Release type: ${DECISION}"
            echo
            echo "Reason: ${REASON}"
            echo
            echo "### Merged PRs since previous tag"
            if [ "$(jq 'length' /tmp/pr_context.json)" -eq 0 ]; then
              echo "No merged PRs found since the previous release tag."
            else
              jq -r '.[] | "- #\(.number) \(.title) (@\(.user)) — \(.html_url)"' /tmp/pr_context.json
            fi
          } > /tmp/release-notes.md
          echo "notes_path=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.tag != '' && steps.dryrun.outputs.enabled != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ steps.changelog.outputs.notes_path }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists for $TAG; skipping."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"

      - name: Release summary
        if: steps.version.outputs.tag != '' && steps.dryrun.outputs.enabled != 'true'
        run: |
          echo "## Release created" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Decision: ${{ steps.version.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.version.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run release summary
        if: steps.version.outputs.tag != '' && steps.dryrun.outputs.enabled == 'true'
        run: |
          echo "## Dry run: no release published" >> "$GITHUB_STEP_SUMMARY"
          echo "Decision: ${{ steps.version.outputs.decision }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Reason: ${{ steps.version.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Current version: ${{ steps.version.outputs.current }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Would publish tag: ${{ steps.version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
